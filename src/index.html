/* planes on the ground: in the slot of the flying plane (between the two airport codes) a small scene, a side view of the plane in front of an airport that scrolls from right to left.
   The scene is drawn 60 px high and scaled down; the motion is done in renderer.js (gsMotion) and follows the ground speed */
.rt>.fl{outline:1px solid transparent;outline-offset:-1px;transition:height .7s ease,margin-top .7s ease,border-radius .7s ease,outline-color .7s ease}.fl::before,.fl>i{transition:opacity .7s ease}
.rt>.fl.nt,.rt>.fl.nt *,.rt>.fl.nt::before{transition:none!important}
.rt>.fl.sw{cursor:var(--ptr)}
.rt>.fl.g{height:32px;margin-top:2px;border-radius:7px;outline-color:#ffffff1f}.fl.g::before,.fl.g>i{opacity:0}
.fl .gsi{position:absolute;left:0;top:0;width:192%;height:60px;transform:scale(.52);transform-origin:0 0;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility 0s .7s}.fl.g .gsi{opacity:1;visibility:visible;transition:opacity .7s ease}
.gsi .gl{position:absolute;left:0;display:block;will-change:transform}.gsi .far{top:0}.gsi .mid{bottom:12px}
.gsi .bg,.gsi .bg>div,.gsi .sky,.gsi .gnd{position:absolute;inset:0}
.gsi .bgn{background:linear-gradient(#0b1422,#15263b 55%,#27405c)}.gsi .bgd{background:linear-gradient(#3f86d6,#7db6e8 62%,#c4e0f3);opacity:0;transition:opacity .9s linear}
.gsi .stars{position:absolute;left:0;top:0;width:100%;height:60px;opacity:0;transition:opacity .9s linear}
.gsi .body{position:absolute;opacity:0;transform:translate(-50%,-50%);transition:left .9s linear,top .9s linear,opacity .9s linear}
.gsi .sun{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#fffbe0 0 32%,#ffe27a 33% 52%,#ffd24d00 74%)}.gsi .moon{width:16px;height:16px;filter:drop-shadow(0 0 5px #e9ecff99)}
.gsi .sky{opacity:0;transition:opacity .9s linear}.gsi .sky .gl{top:0;transition:filter .9s linear}.gsi:not(.day) .sky .gl{filter:brightness(.42) saturate(.8)}
.gsi .gnd{transition:transform .9s linear,filter .9s linear}.gsi.day .gnd{filter:brightness(1.85) saturate(.8)}
.gsi .plane{transition:transform .9s ease;transform-origin:48% 92%}.gsi .gear{transition:opacity .5s,transform .5s;transform-box:fill-box;transform-origin:50% 0}.gsi .gear.up{opacity:0;transform:scaleY(.15)}
.gsi .near{position:absolute;left:0;right:0;bottom:0;height:13px;background:linear-gradient(#262629,#18181a);border-top:1px solid #55555c;overflow:hidden}
.gsi .nl{position:absolute;left:0;top:5px;width:700px;height:2px;background:repeating-linear-gradient(90deg,#f2c230 0 12px,transparent 12px 28px);will-change:transform}
.gsi .plane{position:absolute;left:50%;margin-left:-52px;bottom:5px;width:104px;height:auto;filter:drop-shadow(0 2px 2px #0008)}.gsi .wheel{transform-box:fill-box;transform-origin:center}
html:is([lang=ar],[lang=fa]) #side,html:is([lang=ar],[lang=fa]) #card,html:is([lang=ar],[lang=fa]) #apc,html:is([lang=ar],[lang=fa]) .mdl{direction:rtl}
html:is([lang=ar],[lang=fa]) #side .brand{direction:ltr} /* the title and the language menu keep their place, so the menu doesn't open off screen */

#lbx{position:fixed;inset:0;z-index:5000;background:#000d;display:flex;align-items:center;justify-content:center;padding:48px 64px;animation:lmin .16s ease-out}#lbx{touch-action:none;user-select:none}#lbx img{position:absolute;left:50%;top:50%;margin:0;translate:-50% -50%;max-width:none;border-radius:4px;box-shadow:0 10px 50px #000;cursor:zoom-in;will-change:transform;transform-origin:center}#lbx.zm img{cursor:grab}#lbx.zm:active img{cursor:grabbing}

.apm{background:none;border:0}.apm .apb{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;box-sizing:border-box;background:radial-gradient(circle at 50% 20%,#35557f,#16223a 70%);border:1.5px solid #f2c230;box-shadow:0 1px 4px #000a,0 0 0 2px #f2c23033;transition:transform .15s,box-shadow .15s}
.apm .apb svg{display:block;width:100%;height:100%}.apm:not(.big) .apb{padding:2px;border-width:1px}
.apm.big .apb{box-shadow:0 1px 5px #000b,0 0 0 2px #f2c23055}.apm:hover .apb{transform:scale(1.3);box-shadow:0 2px 8px #000b,0 0 0 3px #f2c23077,0 0 12px #f2c230aa}

/* Phones and small tablets (the web demo; the desktop app has its own window): the menu is a drawer over the map, the cards are sheets at the bottom, the bars shrink */

  #app{position:relative;display:block}
  aside{position:absolute;left:0;top:0;bottom:0;width:min(88vw,330px);z-index:2500;box-shadow:0 0 40px #000c;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
  aside.hide{margin-left:0;transform:translateX(-105%);box-shadow:none}
  main{position:absolute;inset:0}
  #open{top:calc(10px + env(safe-area-inset-top,0px));left:10px}
  .bar{top:calc(10px + env(safe-area-inset-top,0px));right:10px;padding:5px 9px;gap:6px}#clock{font-size:17px!important}.bar .ct small,.bar .ct i{font-size:9px}
  #card,#apc{left:8px;right:8px;top:auto;bottom:calc(66px + env(safe-area-inset-bottom,0px));width:auto;max-height:58%;transform:translateY(130%)}#card.show,#apc.show{transform:none}
  #rp{left:8px;right:62px;bottom:calc(8px + env(safe-area-inset-bottom,0px));gap:8px;padding:7px 10px}
  #thn{max-width:calc(100% - 140px);white-space:normal;text-align:center;font-size:11px;top:60px}
  #toast{left:8px;right:8px;transform:none;top:60px;align-items:stretch}.tm{min-width:0;max-width:none}
  .mdl .bx,#lb .bx,#dy .bx,#emgm .bx,#stt .bx{width:96%!important;max-height:92%!important}
  #tour .tip{width:min(300px,calc(100vw - 24px))}
  #welcome .wc{padding:22px 16px 18px}#welcome .wg9{gap:6px}#welcome .wg9 button{padding:8px 2px;font-size:12px}
  #lbx{padding:56px 8px 56px}#lbx .ln{width:36px}#lbx .lz{right:56px}
  .leaflet-control-zoom{display:none}
  #webBar{bottom:auto!important;top:60px!important;max-width:calc(100% - 20px)!important;padding:8px 12px!important;font-size:12px!important;gap:6px!important}#toast{top:118px!important}
  #sx{display:inline-flex!important}
}

/* filter polish */
.flt .ck{display:flex;flex-direction:row;align-items:center;gap:10px;margin:4px 0}
.apr input{background:#1c1c1c;border-color:#4a4740;color:#f4f1e8;font:600 13px 'Segoe UI Variable','Segoe UI',Inter,system-ui,sans-serif;letter-spacing:.02em}
.apr input::placeholder{color:#a9a395;opacity:1;font-weight:500}

.apd .ib{position:relative;flex:none;width:32px;height:32px;border-radius:50%;font-size:17px;display:flex;align-items:center;justify-content:center;background:#1c1c1c;border-color:#4a4740;color:var(--ac);transition:transform .35s cubic-bezier(.3,1.5,.5,1),background .2s,color .2s,box-shadow .2s}

#fRst[hidden]{display:none}#fRst svg{width:15px;height:15px;transition:transform .5s cubic-bezier(.3,1.4,.4,1)}#fRst span{flex:1;text-align:left}
#fRst em,#fCnt{font-style:normal;font:800 11px 'Segoe UI',system-ui,sans-serif;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--ac);color:#111;display:inline-grid;place-items:center}
#fCnt{margin-left:8px;margin-right:auto}#fCnt[hidden]{display:none}
#fRst:hover{background:var(--ac);color:#111}#fRst:hover svg{transform:rotate(-360deg)}#fRst:hover em{background:#111;color:var(--ac)}
#fPh button{font-size:12px;padding:7px 2px}
.qw{position:relative;margin:10px 14px}.qw #q{margin:0;width:100%;padding-right:34px}
#qx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;border:0;background:#ffffff14;color:var(--fg);display:grid;place-items:center;cursor:pointer;transition:background .2s,color .2s,transform .25s}
#qx[hidden]{display:none}#qx svg{width:10px;height:10px}#qx:hover{background:var(--ac);color:#111;transform:translateY(-50%) rotate(90deg)}
/* dock v2 */
#foot{position:sticky}#foot .fr2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#foot .setb,#fb{width:auto;margin:0;justify-content:center;flex:none;padding:10px 8px!important;gap:8px;border-radius:12px;font-size:12px}
#foot .setb .sl{flex:none;font-size:12px}#foot .setb .gr,#fb svg{width:19px;height:19px}
#fb{display:flex;align-items:center}
#foot #ver{text-align:center;padding:0;letter-spacing:.2em;opacity:.7}
#cmenu{position:absolute;left:12px;right:12px;bottom:calc(100% - 4px);display:flex;flex-direction:column;gap:2px;padding:6px;background:#1f1f1f;border:1px solid #f2c23055;border-radius:12px;box-shadow:0 -10px 28px #000b;animation:cmi .22s cubic-bezier(.2,.8,.3,1.2)}
#cmenu[hidden]{display:none}@keyframes cmi{from{opacity:0;transform:translateY(8px) scale(.97)}}
#cmenu button{text-align:left;background:transparent;border:0;border-radius:8px;padding:10px 12px;color:var(--fg);font:600 13px 'Segoe UI Variable','Segoe UI',Inter,system-ui,sans-serif;cursor:pointer;transition:background .15s,color .15s,padding .2s}
#cmenu button:hover{background:var(--ac);color:#111;padding-left:16px}
#upd{bottom:100px}
.apr input#fDep,.apr input#fArr{font-size:12px;padding-right:20px;background-position:right 6px center;background-size:11px;padding-left:9px}
.dr{margin-bottom:10px}

/* round 4: slim dock, sections as separate cards */
#foot{padding:6px 10px;gap:0;box-shadow:0 -6px 14px #0007}
#foot .fr2{gap:6px}
#foot .setb,#fb{padding:6px 8px!important;border-radius:9px;font-size:12px;box-shadow:none}
#foot .setb .gr,#fb svg{width:16px;height:16px}
#foot .setb::after{display:none}
#foot{margin-top:auto}#foot #ver{display:block;position:static;margin:2px -12px -8px;padding:7px 0 8px;border-top:1px solid #ffffff14;background:#0003;text-align:center;text-transform:none;font:600 11px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.12em;color:#d9bf62;opacity:1}#foot #ver:empty{display:none}
#upd{bottom:52px}
#side>.sec:not(#srch),#side>.flt{margin:8px 10px 0;padding:4px 14px 12px;background:#ffffff06;border:1px solid var(--line);border-radius:12px;transition:background .2s,border-color .2s}
#side>.sec:not(#srch):not(.collapsed),#side>.flt:not(.collapsed){border-color:#ffffff1f;background:#ffffff09}
#side>.sec:not(#srch)>.lbl,#side>.flt>.lbl{position:relative;padding-left:12px}
#side>.sec:not(#srch)>.lbl::before,#side>.flt>.lbl::before{content:'';position:absolute;left:0;top:50%;width:3px;height:14px;margin-top:-7px;border-radius:2px;background:var(--ac);opacity:.9;transition:height .25s,opacity .25s}
#side>.collapsed>.lbl::before{height:8px;margin-top:-4px;opacity:.35}
#side>.collapsed{padding-bottom:0!important}#side>.collapsed>.lbl{margin-bottom:8px}
#srch{margin-top:8px}

/* round 5: multi-value fields (+ adds the typed value, × clears), chips, card for the aircraft list, thicker accent bar */
.apd{display:grid;grid-template-columns:1fr 34px;grid-template-rows:auto auto;gap:6px 8px;margin-top:6px;align-items:start}
.apd .apc1:first-child{grid-column:1;grid-row:1}.apd .apc1:last-child{grid-column:1;grid-row:2}
.apd #fSw{grid-column:2;grid-row:1/3;align-self:center;width:34px;height:34px;margin:0}.apd #fSw span{display:block;transform:rotate(90deg)}
.apr1{margin-top:6px}
.fw{position:relative}
.fw input{width:100%;box-sizing:border-box;padding:9px 62px 9px 11px;background:#1c1c1c;border:1px solid #4a4740;border-radius:8px;color:#f4f1e8;outline:0;font:600 13px 'Segoe UI Variable','Segoe UI',Inter,system-ui,sans-serif;letter-spacing:.02em;text-transform:none;transition:border-color .2s,box-shadow .2s,background .2s}
.fw input#fDep,.fw input#fArr{text-transform:uppercase}.fw input::placeholder{text-transform:none;color:#a9a395;opacity:1;font-weight:500}
.fw input:hover{border-color:#6b665a}.fw input:focus{border-color:var(--ac);box-shadow:0 0 0 3px #f2c23026}
.fw input.set{border-color:#f2c23099;background:#f2c2300d;color:var(--ac)}
.fw input[list]{background-image:none}.fw input::-webkit-calendar-picker-indicator{display:none!important}
.fw input:-webkit-autofill,.fw input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 100px #1c1c1c inset;-webkit-text-fill-color:#f4f1e8}
.fw button{position:absolute;top:50%;width:24px;height:24px;margin-top:-12px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;opacity:0;pointer-events:none;transform:scale(.6);transition:opacity .18s,transform .22s cubic-bezier(.3,1.6,.5,1),background .15s,color .15s}
.fw button svg{width:11px;height:11px}
.fw .fx{right:6px;background:#ffffff14;color:var(--fg)}.fw .fp{right:34px;background:#f2c23026;color:var(--ac)}
.fw.hasv .fp,.fw.hasany .fx{opacity:1;pointer-events:auto;transform:none}
.fw .fp:hover{background:var(--ac);color:#111}.fw .fx:hover{background:#ff6b5e;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chips:not(:empty){margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 4px 3px 9px;border-radius:999px;background:#f2c23022;border:1px solid #f2c23066;color:var(--ac);font:700 11px 'Segoe UI',system-ui,sans-serif;animation:chin .2s cubic-bezier(.3,1.5,.5,1)}
.chip b{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:#ffffff18;color:var(--fg);font-size:11px;line-height:1}.chip b:hover{background:#ff6b5e;color:#fff}
@keyframes chin{from{opacity:0;transform:scale(.7)}}
/* accent bar on every card title, bigger */
#side>.sec>.lbl::before,#side>.flt>.lbl::before{width:4px;height:20px;margin-top:-10px;opacity:1;background:linear-gradient(180deg,#ffd75e,var(--ac))}
#side>.collapsed>.lbl::before{height:12px;margin-top:-6px;opacity:.6}
#side>.sec>.lbl,#side>.flt>.lbl{position:relative;padding-left:14px}
/* aircraft list as a card too */
#srch{margin:8px 10px 6px;background:#ffffff09;border:1px solid #ffffff1f!important;border-radius:12px;overflow:hidden;padding-top:4px}
#srch>.lbl{padding-left:28px!important}#srch>.lbl::before{left:14px}
#srch.collapsed{background:#ffffff06;border-color:var(--line)!important}
/* slimmer dock */
#foot{padding:4px 10px 5px}#foot .setb,#fb{padding:5px 8px!important}

/* accent bars: same, solid and bright on every card title (aircraft list included) */
#side>.sec:not(#srch)>.lbl::before,#side>.flt>.lbl::before,#srch>.lbl::before{content:'';position:absolute;left:0;top:50%;width:5px;height:22px;margin-top:-11px;border-radius:3px;background:#ffcc33;opacity:1;box-shadow:0 0 8px #ffcc3388;transition:height .25s,margin .25s}
#side>.collapsed>.lbl::before,#side>.sec.collapsed:not(#srch)>.lbl::before{height:14px;margin-top:-7px;opacity:1}
#srch>.lbl{position:relative;padding-left:28px!important}#srch>.lbl::before{left:14px}

/* filters: breathing room between groups */
#side .flt .fr{margin-top:18px}#side .flt .fr:first-of-type{margin-top:8px}
.flt .dr{margin-top:8px;margin-bottom:30px}
.dr .rmin,.dr .rmax{top:24px}
#side .flt .ff{margin:0;padding:18px 0 0;border-top:1px solid var(--line)}
.flt .ff+.btns,.flt .ff+.apd,.flt .ff+.apr1{margin-top:10px}
.flt .apd{gap:8px 10px}
.flt .cks{margin-top:20px;padding-top:12px}
.mdl .rcmap{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:14px;padding:11px 16px;border-radius:12px;border:1px solid #ffcc3366;background:linear-gradient(180deg,#ffcc3322,#ffcc3310);color:#ffcc33;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer;transition:background .18s,transform .18s,box-shadow .18s}.mdl .rcmap .ar{transition:transform .18s}.mdl .rcmap:hover{background:#ffcc33;color:#111;box-shadow:0 4px 16px #ffcc3333}.mdl .rcmap:hover .ar{transform:translateX(3px)}.mdl .rcmap:active{transform:scale(.98)}
</style></head>
<body><div id="app">
<aside id="side"><div class="brand"><span class="bt">SKYTRACK</span><span class="bb"><button class="ib" id="sx" aria-label="Close menu">✕</button><button id="lang" class="lsw" title="Language / Dil" aria-label="Language / Dil" aria-haspopup="true"><i class="lc">EN</i><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg></button><div id="lmenu" hidden></div></span></div>
<div class="sec"><div class="lbl">Data</div><div class="btns"><button id="mDemo" class="on">Demo</button><button id="mLive">Live</button></div><div id="st"></div></div>
<div class="sec"><div class="lbl">Mode</div><div class="btns"><button id="mNorm" class="on">Normal</button><button id="mSpot">Plane spotter</button></div>

<div class="btns" id="ovRmRow" style="margin-top:8px;display:none"><button id="bOverRm">✕ Remove overhead spot</button></div></div>
<div class="sec" id="spt" style="display:none"></div>
<div class="sec"><div class="lbl">Map</div><div class="btns seg" id="tiles"><button data-t="osm">Standard</button><button data-t="light">Light</button><button data-t="dark">Dark</button></div><div class="btns wrap" style="margin-top:8px"><button id="bAp" class="on">Airports</button><button id="bZ">Alert zone</button><button id="bRd" title="Rain radar">Radar</button><button id="bTb" title="Turbulence advisories (SIGMET / G-AIRMET)">Turbulence</button><button id="bWd" title="Wind arrows">Wind</button><button id="bNt" title="Day / night">Night</button><button id="bCl" title="Satellite imagery with clouds (NASA, latest daily image)">Clouds</button><button id="bTr" title="Aircraft trails">Trails</button></div><select id="wdLv" style="display:none;width:100%;margin-top:6px"><option value="0">Wind: FL050</option><option value="1">Wind: FL100</option><option value="2">Wind: FL180</option><option value="3">Wind: FL300</option><option value="4" selected>Wind: FL340</option><option value="5">Wind: FL390</option></select>
<label class="zr"><span>Zone radius</span> <span class="stp"><button type="button" id="zM" aria-label="−"><svg viewBox="0 0 12 12"><path d="M2.5 6h7"/></svg></button><input id="zR" type="number" min="3" max="500" step="1" value="100"><button type="button" id="zP" aria-label="+"><svg viewBox="0 0 12 12"><path d="M2.5 6h7M6 2.5v7"/></svg></button></span> <span>km</span></label>
</div>
<div class="flt"><div class="lbl"><span>Filters</span><em id="fCnt" hidden></em></div><div class="fr"><span>Altitude</span><span><b id="vA">0</b> – <b id="vM">45.000+</b> <u id="uA">ft</u></span></div>
<div class="dr" id="dr"><input id="fA" type="range" min="0" max="45000" step="1000" value="0"><input id="fM" type="range" min="0" max="45000" step="1000" value="45000"><span class="rmin">min</span><span class="rmax">max</span></div>
<div class="fr"><span>Speed</span><span><b id="vS">0</b> – <b id="vSM">600+</b> <u id="uS">kt</u></span></div>
<div class="dr" id="dr2"><input id="fS" type="range" min="0" max="600" step="25" value="0"><input id="fSM" type="range" min="0" max="600" step="25" value="600"><span class="rmin">min</span><span class="rmax">max</span></div>
<div class="ff">Flight phase</div>
<div class="btns seg" id="fPh" style="margin-top:6px"><button data-p="" class="on">All</button><button data-p="c">Climbing</button><button data-p="z">Cruise</button><button data-p="d">Descending</button></div>
<div class="ff">Airport</div>
<div class="apd"><div class="apc1"><div class="fw"><input id="fDep" list="apList" placeholder="Departure" autocomplete="off"><button type="button" class="fp" data-f="fDep" aria-label="Add"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M2.5 6h7M6 2.5v7"/></svg></button><button type="button" class="fx" data-f="fDep" aria-label="Remove"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg></button></div><div class="chips" id="cDep"></div></div><button id="fSw" class="ib" title="Departure ↔ arrival"><span>⇄</span></button><div class="apc1"><div class="fw"><input id="fArr" list="apList" placeholder="Arrival" autocomplete="off"><button type="button" class="fp" data-f="fArr" aria-label="Add"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M2.5 6h7M6 2.5v7"/></svg></button><button type="button" class="fx" data-f="fArr" aria-label="Remove"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg></button></div><div class="chips" id="cArr"></div></div></div>
<div class="ff">Airline</div>
<div class="apr1"><div class="fw"><input id="fAl" list="alList" placeholder="e.g. THY, Pegasus, Lufthansa" autocomplete="off"><button type="button" class="fp" data-f="fAl" aria-label="Add"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M2.5 6h7M6 2.5v7"/></svg></button><button type="button" class="fx" data-f="fAl" aria-label="Remove"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg></button></div><div class="chips" id="cAl"></div></div><datalist id="alList"></datalist>
<div class="ff">Aircraft type</div>
<div class="apr1"><div class="fw"><input id="fTp" list="tpList" placeholder="e.g. B738, A320, boeing 777" autocomplete="off"><button type="button" class="fp" data-f="fTp" aria-label="Add"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M2.5 6h7M6 2.5v7"/></svg></button><button type="button" class="fx" data-f="fTp" aria-label="Remove"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg></button></div><div class="chips" id="cTp"></div></div><datalist id="tpList"></datalist>
<div class="ff">Country</div>
<div class="apr1"><div class="fw"><input id="fCo" list="coList" placeholder="e.g. Türkiye, Germany, USA" autocomplete="off"><button type="button" class="fp" data-f="fCo" aria-label="Add"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M2.5 6h7M6 2.5v7"/></svg></button><button type="button" class="fx" data-f="fCo" aria-label="Remove"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg></button></div><div class="chips" id="cCo"></div></div><datalist id="coList"></datalist>
<div id="apSt" class="rtx"></div><datalist id="apList"></datalist>
<div class="cks"><label class="ck"><input id="fG" type="checkbox" checked> Show aircraft on the ground</label>
<label class="ck"><input id="fF" type="checkbox"> Favorites only ★</label>
<label class="ck"><input id="fE" type="checkbox"> Emergencies only</label>
<button id="fRst" type="button" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a5 5 0 1 0 1.6-3.7M3 2.5v3h3"/></svg><span>Reset filters</span><em id="fCnt2"></em></button></div></div>
<div class="sec" id="wls" style="display:none"></div>
<div class="sec" id="srch"><div class="lbl">Aircraft</div><div class="qw"><input id="q" placeholder="Search callsign or registration…"><button id="qx" type="button" aria-label="Clear" hidden><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg></button></div><div id="meta"></div><div id="list"></div></div><div id="upd" hidden></div><div id="foot"><div id="cmenu" hidden><button data-c="bug">Report a bug</button><button data-c="idea">Request a feature</button><button data-c="info">Copy app info</button></div><div class="fr2"><button id="bSet" class="setb"><svg class="gr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/><circle cx="12" cy="12" r="6.6" stroke-dasharray="2.2 2.6"/></svg><span class="sl">Settings</span></button><button id="fb" title="Report a bug or request a feature"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path class="fl" d="m4 7.5 8 6 8-6"/></svg><span>Contact us</span></button></div><div id="ver">SkyTrack</div></div></aside>
